$schema: "http://json-schema.org/draft-06/schema#"

description: Optional downsampling file (config/downsample.csv)
properties:
  sample:
    type: string
    pattern: "^[\w\d_]+_[\d]+$"
    description: IP or control sample name/identifier
  percentage:
    type: number
    exclusiveMinimum: 0
    maximum: 100
    description: Percentage of reads to keep (100 = no downsampling)

required:
  - sample
  - percentage
